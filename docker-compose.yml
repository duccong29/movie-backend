version: '3.8'

services:
  kafka:
    image: 'bitnami/kafka:latest'
    container_name: movies-kafka
    ports:
      - '9094:9094'
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    volumes:
      - kafka_data:/bitnami/kafka
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - movies-network

  redis:
    image: 'bitnami/redis:latest'
    container_name: movies-redis
    environment:
      - REDIS_PASSWORD=redis123
#      - REDIS_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/bitnami/redis
    healthcheck:
      test: ["CMD", "redis-cli", "--password", "redis123", "ping"]
      interval: 5s
      timeout: 2s
      retries: 3
    networks:
      - movies-network

  elasticsearch:
    image: 'bitnami/elasticsearch:latest'
    container_name: movies-elasticsearch
    environment:
      - ELASTICSEARCH_ENABLE_SECURITY=false
      - ELASTICSEARCH_HTTP_CORS_ENABLED=true
      - ELASTICSEARCH_HTTP_CORS_ALLOW_ORIGIN=*
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/bitnami/elasticsearch
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - movies-network

volumes:
  redis_data:
    driver: local
  elasticsearch_data:
    driver: local
  kafka_data:
    driver: local

networks:
  movies-network:
    driver: bridge